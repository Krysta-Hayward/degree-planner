
services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        image: degree-planner/app
        entrypoint: ['/bin/bash', '/var/www/html/docker/entrypoint.sh']
        ports:
            - '${APP_PORT:-80}:8000'
        volumes:
            - '.:/var/www/html'
            - 'degree-planner-vendor:/var/www/html/vendor'

volumes:
    degree-planner-vendor:
