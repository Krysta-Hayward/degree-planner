name: DreamHost Automated Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Matrix
        uses: actions/checkout@v4

      - name: Deploy to DreamHost via SSH Hooks
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DREAMHOST_HOST }}
          username: ${{ secrets.DREAMHOST_USER }}
          key: ${{ secrets.DREAMHOST_SSH_KEY }}
          fingerprint: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
          script: |
            cd ~/degreeplanner.dedsectionslair.net
            git fetch origin
            git checkout main
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
