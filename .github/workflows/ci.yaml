name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/deployment
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Github code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate testing environment file
        run: cp .env.testing.example .env.testing

      - name: Generate application key for testing
        run: php artisan key:generate --env=testing

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --env=testing

      - name: Run tests
        run: vendor/bin/pest

  deploy:
    name: Deploy to DreamHost
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/deployment'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Github code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite

      - name: Install Production Dependencies
        run: composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DREAMHOST_SSH_KEY }}
          known_hosts: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}

      - name: Sync Files via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i /home/runner/.ssh/id_github -o IdentitiesOnly=yes" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='node_modules' \
            --exclude='vendor/bin/sail' \
            ./ ${{ secrets.DREAMHOST_USER }}@${{ secrets.DREAMHOST_HOST }}:/home/ded_section/degreeplanner.dedsectionslair.net

      - name: Run Post-Deployment Commands
        run: |
          ssh ${{ secrets.DREAMHOST_USER }}@${{ secrets.DREAMHOST_HOST }} << 'EOF'
            cd /home/ded_section/degreeplanner.dedsectionslair.net
            mkdir -p database
            touch database/database.sqlite
            
            if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate
            fi
            
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
          EOF
